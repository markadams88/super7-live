<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super 7 Live</title>
<meta name="description" content="Answer tonight's Super 7 questions live, from Aston University Mathematics School.">
<meta name="theme-color" content="#610064">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Aston University Mathematics School">
<meta property="og:title" content="Super 7 Live">
<meta property="og:description" content="Free online GCSE maths every Monday at 18:10, from Aston University Mathematics School.">
<meta property="og:url" content="https://markadams88.github.io/super7-live/">
<meta property="og:image" content="https://markadams88.github.io/super7-live/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="vendor/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/katex.css">
<link rel="stylesheet" href="app.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/auto-render.min.js"></script>
<script src="firebase-config.js"></script>
<script src="packs/index.js"></script>
<script src="shared.js"></script>
</head>
<body>
<header class="top">
  <span class="brand" role="img" aria-label="Aston University Mathematics School"><svg class="logo" aria-hidden="true"><use href="assets/brand.svg#aums"></use></svg></span>
  <div class="prodname"><span class="p">Super 7 Live</span><span class="ttl" id="ttl">Free online GCSE maths</span></div>
  <span class="sp"></span>
  <button type="button" class="chip" id="who" style="display:none" title="Not you? Tap to change your name"></button>
  <span class="chip live" id="state" role="status" aria-live="polite">not started</span>
</header>
<div class="offbar" role="status">Reconnecting. Everything on this page is safe, keep going.</div>
<div id="demo" class="demo" style="display:none">Local demo mode: this browser only. Add the Firebase config to go live.</div>
<div class="note" id="note" role="alert"><div><span class="who">Mr Adams says</span><span id="notetext"></span></div><button type="button" class="btn small grey" id="noteok">OK</button></div>
<main id="main"><div class="boot" aria-label="Connecting"><i></i></div></main>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><div class="demo">Super 7 Live needs JavaScript switched on.</div></noscript>

<script>
/* ============================================================
   Super 7 Live, student screen.
   Built to hold 500 at once, so this page subscribes to exactly three
   small things: the session state, a note addressed to this student, and
   a request for this student's board. It never subscribes to a list of
   other students, and it never uploads its board unless it is asked for.
   A correct answer opens the extension straight away, with no teacher action.
   ============================================================ */
(function(){
"use strict";
var db=S7.openDB(), uid=S7.uid(), main=document.getElementById('main');
if(db.kind==='local') document.getElementById('demo').style.display='block';

/* a hairline under the header once the page scrolls */
addEventListener('scroll',function(){ document.body.classList.toggle('scrolled', scrollY>4); },{passive:true});
/* tell the student when the connection drops, but not on the first load */
if(db.kind==='firebase'){ var wasOn=false;
  db.on('.info/connected',function(c){ if(c) wasOn=true; document.body.classList.toggle('offline', wasOn && !c); }); }

var sid=null, pack=null, state=null, name=null;
var unsubs=[], perStudent=[];
var board=null, extBoard=null, boardTimer=null;
var shown={mode:null,key:null,reveal:null,gridAns:null,gridSol:null};
var mine={};              /* {key:{v,c,x}} what I have answered this session */
var onExt=false;

try{ name=localStorage.getItem('s7name'); }catch(e){}
function base(){ return 's7/sessions/'+sid; }
function statePill(t){ document.getElementById('state').textContent=t; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2200); }
function clearSubs(a){ a.forEach(function(u){ try{u();}catch(e){} }); a.length=0; }

/* ---------- 1. which session is live ---------- */
db.on('s7/current', function(cur){
  var want=S7.param('s', cur);
  if(!want){ sid=null; renderIdle(); return; }
  if(want!==sid){ sid=want; joinSession(); }
});
function renderIdle(){
  statePill('not started');
  main.innerHTML=S7.stage({
    kicker:'Super 7 Live',
    title:'Nothing running <span class="hl">yet</span>',
    lede:'This page wakes up on its own when Mr Adams starts the session. Leave it open.',
    body:'<div class="facts"><div><b>Every Monday</b>18:10 to 19:00</div><div><b>Live on Teams</b>with Mr Adams</div><div><b>Free</b>for every GCSE student</div></div>'
  });
}

/* ---------- 2. join ---------- */
function joinSession(){
  clearSubs(unsubs);
  unsubs.push(db.on(base()+'/meta', function(meta){
    if(!meta){ renderIdle(); return; }
    pack=S7.pack(meta.pack);
    document.getElementById('ttl').textContent=pack?pack.title:'Super 7';
    if(!pack){ main.innerHTML=S7.stage({kicker:'Super 7 Live', title:'Refresh <span class="hl">needed</span>', lede:'Tonight\'s questions are newer than this page. Pull down or press refresh and you will be straight in.'}); return; }
    if(!name) renderJoin(); else register();
  }));
}
function renderJoin(){
  statePill('nearly there');
  main.innerHTML=S7.stage({
    kicker:'Super 7 Live<span class="dot"></span>'+S7.esc(pack.title),
    title:'What shall I call you?',
    lede:'First name and the first letter of your surname is perfect, for example Aisha K.',
    body:'<div class="form"><label class="sr" for="nm">Your name</label>'+
      '<input id="nm" class="inp" maxlength="24" autocomplete="off" autocapitalize="words" enterkeyhint="go" spellcheck="false" placeholder="Your name">'+
      '<button type="button" class="btn gold arrow" id="go">Join</button></div>'+
      '<p class="hint">Only Mr Adams sees your name.</p>'
  });
  var i=document.getElementById('nm');
  i.focus();
  function go(){ var v=S7.cleanName(i.value); if(v.length<2){ toast('Give me at least two letters'); return; }
    name=v; try{ localStorage.setItem('s7name',v); }catch(e){} register(); }
  document.getElementById('go').onclick=go;
  i.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
}
document.getElementById('who').onclick=function(){ try{ localStorage.removeItem('s7name'); }catch(e){} name=null; renderJoin(); };

/* Claim our place in the room. onDisconnect removes it if this page goes away,
   so it has to be re-claimed every time the connection comes back: without that
   a single dropped websocket takes a student off the register for good, even
   though their page is still working. */
function claimPresence(){
  db.set(base()+'/st/'+uid, {n:name, t:db.serverTime()});
  db.onDisconnectRemove(base()+'/st/'+uid);
}
function register(){
  var w=document.getElementById('who'); w.style.display=''; w.textContent=name;
  claimPresence();
  clearSubs(perStudent);
  if(db.kind==='firebase'){
    perStudent.push(db.on('.info/connected', function(c){ if(c) claimPresence(); }));
  }
  /* the only listeners this page ever holds */
  perStudent.push(db.on(base()+'/state', function(s){ state=s||{mode:'lobby'}; render(); }));
  perStudent.push(db.on(base()+'/msg/'+uid, function(m){ if(m&&m.t) showNote(m.t); }));
  perStudent.push(db.on(base()+'/req/'+uid, function(r){ if(r) sendBoard(r); else stopBoard(); }));
}

/* ---------- a note from the teacher ---------- */
var noteEl=document.getElementById('note');
document.getElementById('noteok').onclick=function(){ noteEl.classList.remove('show'); db.remove(base()+'/msg/'+uid); };
function showNote(t){ document.getElementById('notetext').textContent=t; noteEl.classList.add('show'); }

/* ---------- the teacher asked to see my board ----------
   Keeps sending while the teacher has this student open. It stops when the
   teacher closes the panel (which clears req), when the question changes, or
   after a long backstop in case a teacher tab dies with the panel open. */
function stopBoard(){ if(boardTimer){ clearInterval(boardTimer); boardTimer=null; } }
function sendBoard(key){
  stopBoard();
  var n=0;
  function push(){
    var b=(String(key).slice(-1)==='x')?extBoard:board;
    var st=(b&&b.strokes&&b.strokes.length)?b.strokes:null;
    db.set(base()+'/bd/'+uid, st);
    if(++n>600) stopBoard();        /* 12 minutes, a backstop, not a timeout */
  }
  push();
  boardTimer=setInterval(push, 1200);
}

/* ---------- 3. render whatever the teacher is showing ---------- */
function render(){
  if(!state){ return; }
  var m=state.mode||'lobby';
  var same = (m===shown.mode && state.key===shown.key);
  if(!same) stopBoard();
  statePill(m==='lobby'?'waiting':(m==='grid'?'your twelve':(m==='done'?'finished':'question '+state.key)));
  if(m==='lobby'){ if(!same){ shown={mode:m,key:null}; renderLobby(); } return; }
  if(m==='done'){ if(!same){ shown={mode:m,key:null}; renderDone(); } return; }
  if(m==='grid'){
    if(!same){ shown={mode:m,key:null,gridAns:state.gridAns,gridSol:state.gridSol}; renderGrid(); }
    else if(state.gridAns!==shown.gridAns || state.gridSol!==shown.gridSol){ shown.gridAns=state.gridAns; shown.gridSol=state.gridSol; paintGridAnswers(); }
    return;
  }
  if(m==='youdo'){
    if(!same){ shown={mode:m,key:state.key,reveal:state.reveal}; renderYouDo(); }
    else if(state.reveal!==shown.reveal){ shown.reveal=state.reveal; paintSolution(); }
    return;
  }
}
function renderLobby(){
  main.innerHTML=S7.stage({
    layout:'l2',
    kicker:'Super 7 Live<span class="dot"></span>'+S7.esc(pack.title),
    title:'You\'re in, <span class="hl">'+S7.esc(name)+'</span>',
    lede:'Watch the screen on Teams. A question will pop up here the moment Mr Adams sends one.',
    body:'<div class="facts"><div><b>Pen and paper</b>for your working</div><div><b>Calculator</b>you will need it tonight</div><div><b>This page</b>keep it open</div></div>'
  });
}
function renderDone(){
  main.innerHTML=S7.stage({
    layout:'l3',
    kicker:'That is us for tonight',
    title:'Well done, <span class="hl">'+S7.esc(name||'everyone')+'</span>',
    lede:(pack.next?pack.next.replace(/<[^>]+>/g,''):'See you next Monday at 18:10.')
  });
  S7.tex(main);
}

/* ---------- You do ---------- */
function q(key){ return (pack.youdo||[]).filter(function(x){ return x.n===key; })[0]; }
function renderYouDo(){
  var Q=q(state.key); if(!Q){ main.innerHTML=''; return; }
  onExt=false;
  var got=mine[state.key]||{};
  var all=pack.youdo||[];
  main.innerHTML=
    '<div class="band"><div class="band-in"><div>'+
      '<p class="k">You do '+state.key+(all.length?' of '+all.length:'')+'</p>'+
      '<h1>'+S7.esc(S7.subTitle(Q.sub)||('Question '+state.key))+'</h1></div>'+
      '<div class="steps" aria-hidden="true">'+all.map(function(x){ return '<i class="'+(x.n===state.key?'on':(x.n<state.key?'done':''))+'"></i>'; }).join('')+'</div>'+
    '</div></div>'+
    '<div class="wrap">'+
      '<div class="qtext" id="qt">'+Q.q+'</div>'+
      (Q.svg?'<div class="qsvg">'+Q.svg+'</div>':'')+
      '<div class="boardwrap"><canvas id="bd"></canvas></div>'+
      S7.toolsHTML()+
      '<div class="ansrow"><label class="sr" for="ans">Your answer</label><input id="ans" class="inp" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="Your answer" value="'+S7.esc(got.v||'')+'">'+
        '<button type="button" class="btn gold" id="send">Check</button></div>'+
      '<div id="verdict" class="verdict"></div>'+
      '<div id="extbox"></div>'+
      '<div id="sol" class="sol"></div>'+
    '</div>';
  S7.tex(document.getElementById('qt'));
  board=S7.Board(document.getElementById('bd'),{});
  S7.wireTools(main.querySelector('.tools'), board);
  document.getElementById('send').onclick=submit;
  document.getElementById('ans').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  if(got.v) verdict(got.c);
  if(got.c) openExtension(true);
  paintSolution();
}
function submit(){
  var Q=q(state.key); if(!Q) return;
  var el=document.getElementById(onExt?'extans':'ans');
  var v=(el.value||'').trim(); if(!v){ toast('Type your answer first'); return; }
  if(onExt){
    var ok=S7.checkAnswer(Q.ext.answer, v);
    db.update(base()+'/an/'+state.key+'/'+uid, {x: ok?1:0, xv:v.slice(0,40)});
    extVerdict(ok);
    return;
  }
  var c=S7.checkAnswer(Q.answer, v);
  mine[state.key]={v:v,c:c?1:0};
  db.set(base()+'/an/'+state.key+'/'+uid, {n:name, v:v.slice(0,40), c:c?1:0, t:db.serverTime()});
  verdict(c);
  var vd=document.getElementById('verdict'); if(vd&&vd.scrollIntoView) vd.scrollIntoView({behavior:'smooth',block:'nearest'});
  if(c) openExtension(false);
}
function verdict(c){
  var d=document.getElementById('verdict'); if(!d) return;
  d.className='verdict '+(c?'ok':'no');
  d.innerHTML=c?'<div><b>Correct.</b> Nice one. Have a go at the extension below while everyone catches up.</div>'
               :'<div><b>Not quite.</b> Have another look, you can change your answer and check again.</div>';
}
/* ---------- the extension appears automatically on a correct answer ---------- */
function openExtension(quiet){
  var Q=q(state.key); if(!Q||!Q.ext){ return; }
  onExt=true;
  var box=document.getElementById('extbox'); if(!box||box.dataset.on) return;
  box.dataset.on='1';
  box.innerHTML='<div class="extcard"><div class="exthead"><span class="tag gold">Extension</span>'+
      '<span class="muted">One harder question, then hang on for the next one</span></div>'+
      '<div class="qtext" id="ext_qt">'+Q.ext.q+'</div>'+
      '<div class="boardwrap small"><canvas id="extbd"></canvas></div>'+
      '<div class="ansrow"><label class="sr" for="extans">Extension answer</label><input id="extans" class="inp" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="Extension answer">'+
      '<button type="button" class="btn gold" id="extsend">Check</button></div><div id="extverdict" class="verdict"></div>'+
      '<div id="extsol" class="sol"></div></div>';
  S7.tex(document.getElementById('ext_qt'));
  extBoard=S7.Board(document.getElementById('extbd'),{});
  document.getElementById('extsend').onclick=submit;
  document.getElementById('extans').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  if(!quiet) setTimeout(function(){ box.scrollIntoView({behavior:'smooth',block:'nearest'}); },250);
}
function extVerdict(ok){
  var Q=q(state.key);
  var d=document.getElementById('extverdict'); if(!d) return;
  d.className='verdict '+(ok?'ok':'no');
  d.innerHTML=ok?'<div><b>Correct.</b> That is the extension done. Sit tight for the next question.</div>'
                :'<div><b>Not quite.</b> Try again, or wait for Mr Adams to go through it.</div>';
  if(ok){
    var s=document.getElementById('extsol');
    s.innerHTML='<div class="solinner"><div class="lab">How it works</div>'+
      (Q.ext.steps||[]).map(function(st){ return '<div class="step"><span class="t">'+S7.esc(st.t)+'</span><span>'+st.m+'</span></div>'; }).join('')+
      (Q.ext.final?'<div class="final">'+Q.ext.final+'</div>':'')+'</div>';
    S7.tex(s);
  }
}
function paintSolution(){
  var s=document.getElementById('sol'); if(!s) return;
  var Q=q(state.key);
  if(!state.reveal||!Q){ s.innerHTML=''; return; }
  s.innerHTML='<div class="solinner"><div class="lab">Worked answer</div>'+
    (Q.steps||[]).map(function(st){ return '<div class="step"><span class="t">'+S7.esc(st.t)+'</span><span>'+st.m+'</span></div>'; }).join('')+
    (Q.final?'<div class="final">'+Q.final+'</div>':'')+'</div>';
  S7.tex(s);
}

/* ---------- the twelve ---------- */
function renderGrid(){
  var cells=(pack.grid||[]).map(function(g){
    return '<button type="button" class="gcell" data-g="'+g.n+'"><span class="gn">Question '+g.n+(g.marks?'<span class="mk"><span class="sr">, </span>&middot; '+g.marks+' mark'+(g.marks>1?'s':'')+'</span>':'')+'</span>'+
      '<span class="gq">'+g.q+'</span>'+(g.svg?'<span class="gd">'+g.svg+'</span>':'')+'<span class="ga"></span></button>';
  }).join('');
  main.innerHTML='<div class="band wide"><div class="band-in"><div><p class="k">'+S7.esc(pack.title)+'</p><h1>Your twelve</h1>'+
    '<p class="sub">Tap any question to open it. Answers appear here when Mr Adams releases them.</p></div></div></div>'+
    '<div class="wrap wide"><div class="ggrid">'+cells+'</div></div>';
  S7.tex(main);
  main.querySelectorAll('.gcell').forEach(function(b){ b.onclick=function(){ openGridQ(+b.dataset.g); }; });
  paintGridAnswers();
}
function paintGridAnswers(){
  (pack.grid||[]).forEach(function(g){
    var c=main.querySelector('.gcell[data-g="'+g.n+'"] .ga'); if(!c) return;
    c.textContent=state.gridAns?(g.a||''):'';
    c.className='ga'+(state.gridAns?' on':'');
  });
}
function openGridQ(n){
  var g=(pack.grid||[]).filter(function(x){return x.n===n;})[0]; if(!g) return;
  var ov=document.createElement('div'); ov.className='over';
  ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-label','Question '+n);
  ov.innerHTML='<div class="overbox"><button type="button" class="x" aria-label="Close">&times;</button>'+
    '<div class="qhead"><span class="tag">Question '+n+' of 12</span>'+(g.marks?'<span class="muted">'+g.marks+' mark'+(g.marks>1?'s':'')+'</span>':'')+'</div>'+
    '<div class="qtext">'+g.q+'</div>'+(g.svg?'<div class="qsvg">'+g.svg+'</div>':'')+
    '<div class="boardwrap"><canvas id="gbd"></canvas></div>'+S7.toolsHTML()+
    '<div class="ansrow"><label class="sr" for="gans">Your answer</label><input id="gans" class="inp" autocomplete="off" enterkeyhint="done" spellcheck="false" placeholder="Your answer"><button type="button" class="btn gold" id="gsend">Check</button></div>'+
    '<div id="gver" class="verdict"></div><div id="gsol" class="sol"></div></div>';
  document.body.appendChild(ov);
  S7.tex(ov);
  var b=S7.Board(ov.querySelector('#gbd'),{});
  S7.wireTools(ov.querySelector('.tools'), b);
  function go(){
    var v=(ov.querySelector('#gans').value||'').trim(); if(!v) return;
    var c=S7.checkAnswer(g.answer, v);
    var d=ov.querySelector('#gver'); d.className='verdict '+(c?'ok':'no');
    d.innerHTML=c?'<div><b>Correct.</b> Nicely done.</div>':'<div><b>Not quite.</b> Have another go.</div>';
    if(c||state.gridSol){
      var s=ov.querySelector('#gsol');
      s.innerHTML='<div class="solinner"><div class="lab">Worked solution</div>'+
        (g.steps||[]).map(function(st){ return '<div class="step"><span class="t">'+S7.esc(st.t)+'</span><span>'+st.m+'</span></div>'; }).join('')+
        (g.a?'<div class="final">'+g.a+'</div>':'')+'</div>';
      S7.tex(s);
    }
  }
  ov.querySelector('#gsend').onclick=go;
  ov.querySelector('#gans').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
  function close(){ ov.remove(); document.removeEventListener('keydown',esc); document.body.style.overflow=''; }
  function esc(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown',esc);
  document.body.style.overflow='hidden';
  ov.querySelector('.x').onclick=close;
  ov.addEventListener('click',function(e){ if(e.target===ov) close(); });
}
})();
</script>
</body>
</html>
