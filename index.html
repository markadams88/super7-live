<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Super 7 Live</title>
<link rel="stylesheet" href="vendor/katex.css">
<link rel="stylesheet" href="app.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/auto-render.min.js"></script>
<script src="firebase-config.js"></script>
<script src="packs/index.js"></script>
<script src="shared.js"></script>
</head>
<body>
<div class="top">
  <span class="flash"><b>7</b>Super 7 Live</span>
  <span class="ttl" id="ttl">Free online GCSE maths from AUMS</span>
  <span class="sp"></span>
  <span class="pill" id="who" style="display:none;cursor:pointer" title="Not you? Tap to change your name"></span>
  <span class="pill live" id="state">not started</span>
</div>
<div id="demo" class="demo" style="display:none">Local demo mode: this browser only. Add the Firebase config to go live.</div>
<div class="note" id="note"><div><span class="who">Mr Adams says</span><span id="notetext"></span></div><button class="btn small grey" id="noteok">OK</button></div>
<div id="main"></div>
<div id="toast"></div>

<script>
/* ============================================================
   Super 7 Live, student screen.
   Built to hold 500 at once, so this page subscribes to exactly three
   small things: the session state, a note addressed to this student, and
   a request for this student's board. It never subscribes to a list of
   other students, and it never uploads its board unless it is asked for.
   A correct answer opens the extension straight away, with no teacher action.
   ============================================================ */
(function(){
"use strict";
var db=S7.openDB(), uid=S7.uid(), main=document.getElementById('main');
if(db.kind==='local') document.getElementById('demo').style.display='block';

var sid=null, pack=null, state=null, name=null;
var unsubs=[], perStudent=[];
var board=null, extBoard=null;
var shown={mode:null,key:null,reveal:null,gridAns:null,gridSol:null};
var mine={};              /* {key:{v,c,x}} what I have answered this session */
var onExt=false;

try{ name=localStorage.getItem('s7name'); }catch(e){}
function base(){ return 's7/sessions/'+sid; }
function statePill(t){ document.getElementById('state').textContent=t; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2200); }
function clearSubs(a){ a.forEach(function(u){ try{u();}catch(e){} }); a.length=0; }

/* ---------- 1. which session is live ---------- */
db.on('s7/current', function(cur){
  var want=S7.param('s', cur);
  if(!want){ sid=null; renderIdle(); return; }
  if(want!==sid){ sid=want; joinSession(); }
});
function renderIdle(){
  statePill('not started');
  main.innerHTML='<div class="center"><div class="card"><div class="eyebrow"><i></i>Super 7 Live</div><h1>Nothing running yet</h1>'+
    '<p class="muted" style="margin-top:10px">This page wakes up on its own when Mr Adams starts the session. Leave it open.</p></div></div>';
}

/* ---------- 2. join ---------- */
function joinSession(){
  clearSubs(unsubs);
  unsubs.push(db.on(base()+'/meta', function(meta){
    if(!meta){ renderIdle(); return; }
    pack=S7.pack(meta.pack);
    document.getElementById('ttl').textContent=pack?pack.title:'Super 7';
    if(!pack){ main.innerHTML='<div class="center"><div class="card"><h1>Refresh needed</h1><p class="muted">This session uses a question pack this page has not got yet. Pull down to refresh.</p></div></div>'; return; }
    if(!name) renderJoin(); else register();
  }));
}
function renderJoin(){
  statePill('nearly there');
  main.innerHTML='<div class="center"><div class="card"><div class="eyebrow"><i></i>'+S7.esc(pack.title)+'</div>'+
    '<h1>What shall I call you?</h1><p class="muted" style="margin:10px 0 16px">First name and the first letter of your surname is perfect, for example Aisha K.</p>'+
    '<input id="nm" class="inp" maxlength="24" autocomplete="off" placeholder="Your name"><button class="btn gold" id="go" style="margin-top:12px;width:100%">Join the session</button></div></div>';
  var i=document.getElementById('nm');
  i.focus();
  function go(){ var v=S7.cleanName(i.value); if(v.length<2){ toast('Give me at least two letters'); return; }
    name=v; try{ localStorage.setItem('s7name',v); }catch(e){} register(); }
  document.getElementById('go').onclick=go;
  i.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
}
document.getElementById('who').onclick=function(){ try{ localStorage.removeItem('s7name'); }catch(e){} name=null; renderJoin(); };

function register(){
  var w=document.getElementById('who'); w.style.display=''; w.textContent=name;
  db.set(base()+'/st/'+uid, {n:name, t:db.serverTime()});
  db.onDisconnectRemove(base()+'/st/'+uid);
  clearSubs(perStudent);
  /* the only three listeners this page ever holds */
  perStudent.push(db.on(base()+'/state', function(s){ state=s||{mode:'lobby'}; render(); }));
  perStudent.push(db.on(base()+'/msg/'+uid, function(m){ if(m&&m.t) showNote(m.t); }));
  perStudent.push(db.on(base()+'/req/'+uid, function(r){ if(r) sendBoard(r); }));
}

/* ---------- a note from the teacher ---------- */
var noteEl=document.getElementById('note');
document.getElementById('noteok').onclick=function(){ noteEl.classList.remove('show'); db.remove(base()+'/msg/'+uid); };
function showNote(t){ document.getElementById('notetext').textContent=t; noteEl.classList.add('show'); }

/* ---------- the teacher asked to see my board ---------- */
function sendBoard(key){
  var b=(String(key).slice(-1)==='x')?extBoard:board;
  db.set(base()+'/bd/'+uid, b?b.strokes:[]);
  /* keep it fresh while they are looking, then stop */
  var n=0, h=setInterval(function(){
    n++; var bb=(String(key).slice(-1)==='x')?extBoard:board;
    db.set(base()+'/bd/'+uid, bb?bb.strokes:[]);
    if(n>40){ clearInterval(h); }
  }, 1500);
  db.on(base()+'/req/'+uid, function(r){ if(!r){ clearInterval(h); } });
}

/* ---------- 3. render whatever the teacher is showing ---------- */
function render(){
  if(!state){ return; }
  var m=state.mode||'lobby';
  var same = (m===shown.mode && state.key===shown.key);
  statePill(m==='lobby'?'waiting':(m==='grid'?'your twelve':(m==='done'?'finished':'question '+state.key)));
  if(m==='lobby'){ if(!same){ shown={mode:m,key:null}; renderLobby(); } return; }
  if(m==='done'){ if(!same){ shown={mode:m,key:null}; renderDone(); } return; }
  if(m==='grid'){
    if(!same){ shown={mode:m,key:null,gridAns:state.gridAns,gridSol:state.gridSol}; renderGrid(); }
    else if(state.gridAns!==shown.gridAns || state.gridSol!==shown.gridSol){ shown.gridAns=state.gridAns; shown.gridSol=state.gridSol; paintGridAnswers(); }
    return;
  }
  if(m==='youdo'){
    if(!same){ shown={mode:m,key:state.key,reveal:state.reveal}; renderYouDo(); }
    else if(state.reveal!==shown.reveal){ shown.reveal=state.reveal; paintSolution(); }
    return;
  }
}
function renderLobby(){
  main.innerHTML='<div class="center"><div class="card"><div class="eyebrow"><i></i>'+S7.esc(pack.title)+'</div>'+
    '<h1>You are in, '+S7.esc(name)+'</h1><p class="muted" style="margin-top:10px">Watch the screen on Teams. A question will pop up here the moment Mr Adams sends one.</p>'+
    '<p class="muted" style="margin-top:10px">Get a pen, some paper and your calculator ready.</p></div></div>';
}
function renderDone(){
  main.innerHTML='<div class="center"><div class="card"><div class="eyebrow"><i></i>That is us for tonight</div>'+
    '<h1>Well done</h1><p class="muted" style="margin-top:10px">'+(pack.next?pack.next.replace(/<[^>]+>/g,''):'See you next Monday at 18:10.')+'</p></div></div>';
  S7.tex(main);
}

/* ---------- You do ---------- */
function q(key){ return (pack.youdo||[]).filter(function(x){ return x.n===key; })[0]; }
function renderYouDo(){
  var Q=q(state.key); if(!Q){ main.innerHTML=''; return; }
  onExt=false;
  var got=mine[state.key]||{};
  main.innerHTML=
    '<div class="wrap">'+
      '<div class="qhead"><span class="tag">You do '+state.key+'</span><span class="muted">'+S7.esc(Q.sub||'')+'</span></div>'+
      '<div class="qtext" id="qt">'+Q.q+'</div>'+
      (Q.svg?'<div class="qsvg">'+Q.svg+'</div>':'')+
      '<div class="boardwrap"><canvas id="bd"></canvas></div>'+
      S7.toolsHTML()+
      '<div class="ansrow"><input id="ans" class="inp" autocomplete="off" placeholder="Your answer" value="'+S7.esc(got.v||'')+'">'+
        '<button class="btn gold" id="send">Check</button></div>'+
      '<div id="verdict" class="verdict"></div>'+
      '<div id="extbox"></div>'+
      '<div id="sol" class="sol"></div>'+
    '</div>';
  S7.tex(document.getElementById('qt'));
  board=S7.Board(document.getElementById('bd'),{});
  S7.wireTools(main.querySelector('.tools'), board);
  document.getElementById('send').onclick=submit;
  document.getElementById('ans').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  if(got.v) verdict(got.c);
  if(got.c) openExtension(true);
  paintSolution();
}
function submit(){
  var Q=q(state.key); if(!Q) return;
  var el=document.getElementById(onExt?'extans':'ans');
  var v=(el.value||'').trim(); if(!v){ toast('Type your answer first'); return; }
  if(onExt){
    var ok=S7.checkAnswer(Q.ext.answer, v);
    db.update(base()+'/an/'+state.key+'/'+uid, {x: ok?1:0, xv:v.slice(0,40)});
    extVerdict(ok);
    return;
  }
  var c=S7.checkAnswer(Q.answer, v);
  mine[state.key]={v:v,c:c?1:0};
  db.set(base()+'/an/'+state.key+'/'+uid, {n:name, v:v.slice(0,40), c:c?1:0, t:db.serverTime()});
  verdict(c);
  if(c) openExtension(false);
}
function verdict(c){
  var d=document.getElementById('verdict'); if(!d) return;
  d.className='verdict '+(c?'ok':'no');
  d.innerHTML=c?'<b>Correct.</b> Nice one. Have a go at the extension below while everyone catches up.'
               :'<b>Not quite.</b> Have another look, you can change your answer and check again.';
}
/* ---------- the extension appears automatically on a correct answer ---------- */
function openExtension(quiet){
  var Q=q(state.key); if(!Q||!Q.ext){ return; }
  onExt=true;
  var box=document.getElementById('extbox'); if(!box||box.dataset.on) return;
  box.dataset.on='1';
  box.innerHTML='<div class="extcard"><div class="exthead"><span class="tag gold">Extension</span>'+
      '<span class="muted">one harder question, then hang on for the next one</span></div>'+
      '<div class="qtext" id="ext_qt">'+Q.ext.q+'</div>'+
      '<div class="boardwrap small"><canvas id="extbd"></canvas></div>'+
      '<div class="ansrow"><input id="extans" class="inp" autocomplete="off" placeholder="Extension answer">'+
      '<button class="btn gold" id="extsend">Check</button></div><div id="extverdict" class="verdict"></div>'+
      '<div id="extsol" class="sol"></div></div>';
  S7.tex(document.getElementById('ext_qt'));
  extBoard=S7.Board(document.getElementById('extbd'),{});
  document.getElementById('extsend').onclick=submit;
  document.getElementById('extans').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  if(!quiet) setTimeout(function(){ box.scrollIntoView({behavior:'smooth',block:'nearest'}); },250);
}
function extVerdict(ok){
  var Q=q(state.key);
  var d=document.getElementById('extverdict'); if(!d) return;
  d.className='verdict '+(ok?'ok':'no');
  d.innerHTML=ok?'<b>Correct.</b> That is the extension done. Sit tight for the next question.'
                :'<b>Not quite.</b> Try again, or wait for Mr Adams to go through it.';
  if(ok){
    var s=document.getElementById('extsol');
    s.innerHTML='<div class="solinner"><div class="lab">How it works</div>'+
      (Q.ext.steps||[]).map(function(st){ return '<div class="step"><span class="t">'+S7.esc(st.t)+'</span><span>'+st.m+'</span></div>'; }).join('')+
      (Q.ext.final?'<div class="final">'+Q.ext.final+'</div>':'')+'</div>';
    S7.tex(s);
  }
}
function paintSolution(){
  var s=document.getElementById('sol'); if(!s) return;
  var Q=q(state.key);
  if(!state.reveal||!Q){ s.innerHTML=''; return; }
  s.innerHTML='<div class="solinner"><div class="lab">Worked answer</div>'+
    (Q.steps||[]).map(function(st){ return '<div class="step"><span class="t">'+S7.esc(st.t)+'</span><span>'+st.m+'</span></div>'; }).join('')+
    (Q.final?'<div class="final">'+Q.final+'</div>':'')+'</div>';
  S7.tex(s);
}

/* ---------- the twelve ---------- */
function renderGrid(){
  var cells=(pack.grid||[]).map(function(g){
    return '<button class="gcell" data-g="'+g.n+'"><span class="gn">Q'+g.n+(g.marks?', '+g.marks+' mark'+(g.marks>1?'s':''):'')+'</span>'+
      '<span class="gq">'+g.q+'</span>'+(g.svg?'<span class="gd">'+g.svg+'</span>':'')+'<span class="ga"></span></button>';
  }).join('');
  main.innerHTML='<div class="wrap"><div class="qhead"><span class="tag">Your twelve</span>'+
    '<span class="muted">tap any question to open it. Answers appear when Mr Adams releases them.</span></div>'+
    '<div class="ggrid">'+cells+'</div></div>';
  S7.tex(main);
  main.querySelectorAll('.gcell').forEach(function(b){ b.onclick=function(){ openGridQ(+b.dataset.g); }; });
  paintGridAnswers();
}
function paintGridAnswers(){
  (pack.grid||[]).forEach(function(g){
    var c=main.querySelector('.gcell[data-g="'+g.n+'"] .ga'); if(!c) return;
    c.textContent=state.gridAns?(g.a||''):'';
    c.className='ga'+(state.gridAns?' on':'');
  });
}
function openGridQ(n){
  var g=(pack.grid||[]).filter(function(x){return x.n===n;})[0]; if(!g) return;
  var ov=document.createElement('div'); ov.className='over';
  ov.innerHTML='<div class="overbox"><button class="x">&times;</button>'+
    '<div class="qhead"><span class="tag">Question '+n+' of 12</span>'+(g.marks?'<span class="muted">'+g.marks+' mark'+(g.marks>1?'s':'')+'</span>':'')+'</div>'+
    '<div class="qtext">'+g.q+'</div>'+(g.svg?'<div class="qsvg">'+g.svg+'</div>':'')+
    '<div class="boardwrap"><canvas id="gbd"></canvas></div>'+S7.toolsHTML()+
    '<div class="ansrow"><input id="gans" class="inp" placeholder="Your answer"><button class="btn gold" id="gsend">Check</button></div>'+
    '<div id="gver" class="verdict"></div><div id="gsol" class="sol"></div></div>';
  document.body.appendChild(ov);
  S7.tex(ov);
  var b=S7.Board(ov.querySelector('#gbd'),{});
  S7.wireTools(ov.querySelector('.tools'), b);
  function go(){
    var v=(ov.querySelector('#gans').value||'').trim(); if(!v) return;
    var c=S7.checkAnswer(g.answer, v);
    var d=ov.querySelector('#gver'); d.className='verdict '+(c?'ok':'no');
    d.innerHTML=c?'<b>Correct.</b>':'<b>Not quite.</b> Have another go.';
    if(c||state.gridSol){
      var s=ov.querySelector('#gsol');
      s.innerHTML='<div class="solinner"><div class="lab">Worked solution</div>'+
        (g.steps||[]).map(function(st){ return '<div class="step"><span class="t">'+S7.esc(st.t)+'</span><span>'+st.m+'</span></div>'; }).join('')+
        (g.a?'<div class="final">Answer: '+g.a+'</div>':'')+'</div>';
      S7.tex(s);
    }
  }
  ov.querySelector('#gsend').onclick=go;
  ov.querySelector('#gans').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
  ov.querySelector('.x').onclick=function(){ ov.remove(); };
  ov.addEventListener('click',function(e){ if(e.target===ov) ov.remove(); });
}
})();
</script>
</body>
</html>
