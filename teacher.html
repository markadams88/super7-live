<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super 7 Live, teacher</title>
<link rel="stylesheet" href="vendor/katex.css">
<link rel="stylesheet" href="app.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="vendor/katex.min.js"></script>
<script src="vendor/auto-render.min.js"></script>
<script src="firebase-config.js"></script>
<script src="packs/index.js"></script>
<script src="shared.js"></script>
</head>
<body class="teacher">
<div class="top">
  <span class="flash"><b>7</b>Super 7 Live, teacher</span>
  <span class="ttl" id="ttl"></span>
  <span class="sp"></span>
  <span class="pill" id="cap">0 in the room</span>
  <span class="pill live" id="state">not started</span>
</div>
<div id="demo" class="demo" style="display:none">Local demo mode: this browser only. Add the Firebase config to go live.</div>
<div id="main"></div>
<div id="toast"></div>

<script>
/* ============================================================
   Super 7 Live, teacher screen.
   Rebuilt for 500 students. It never draws 500 whiteboards: it shows a live
   tally, the wrong answers people are actually giving, and a searchable list
   of names. Click one name and that student's board is fetched on demand.
   Every listener is a child listener, so one student answering costs one
   small message, not a refresh of the whole room.
   ============================================================ */
(function(){
"use strict";
var db=S7.openDB(), main=document.getElementById('main');
if(db.kind==='local') document.getElementById('demo').style.display='block';

var sid=null, pack=null, state={mode:'lobby'}, students={}, answers={}, ansUnsub=null, watching=null, watchUnsub=null;
var nStud=0;
function base(){ return 's7/sessions/'+sid; }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2200); }

/* ---------- PIN ---------- */
var ok=false;
try{ ok = sessionStorage.getItem('s7teach')==='1'; }catch(e){}
if(!ok) askPin(); else boot();
function askPin(){
  main.innerHTML='<div class="center"><div class="card"><div class="eyebrow"><i></i>Teacher screen</div><h1>PIN</h1>'+
    '<input id="pin" class="inp" type="password" inputmode="numeric" style="margin-top:12px" placeholder="PIN">'+
    '<button class="btn gold" id="pgo" style="margin-top:12px;width:100%">Open</button></div></div>';
  var i=document.getElementById('pin'); i.focus();
  function go(){ if(i.value===String(window.S7_TEACHER_PIN||'7777')){ try{ sessionStorage.setItem('s7teach','1'); }catch(e){} boot(); } else toast('Wrong PIN'); }
  document.getElementById('pgo').onclick=go;
  i.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
}

/* ---------- boot ---------- */
function boot(){
  db.on('s7/current', function(cur){
    if(cur && cur!==sid){ sid=cur; attach(); }
    else if(!cur){ sid=null; renderSetup(); }
  });
}
function renderSetup(){
  var opts=S7.packList().map(function(p){ var k=S7.pack(p); return '<option value="'+p+'">'+S7.esc(k?k.title:p)+'</option>'; }).join('');
  main.innerHTML='<div class="center"><div class="card"><div class="eyebrow"><i></i>Start a session</div><h1>Which week?</h1>'+
    '<select id="pk" class="inp" style="margin-top:12px">'+opts+'</select>'+
    '<button class="btn gold" id="start" style="margin-top:12px;width:100%">Start session</button>'+
    '<p class="muted" style="margin-top:12px">Students all use the same link every week, so there is nothing to send round.</p></div></div>';
  document.getElementById('start').onclick=function(){
    var p=document.getElementById('pk').value;
    var id=p+'-'+Date.now().toString(36);
    db.set('s7/sessions/'+id+'/meta',{pack:p,started:db.serverTime()})
      .then(function(){ return db.set('s7/sessions/'+id+'/state',{mode:'lobby',key:0,reveal:0,gridAns:0,gridSol:0}); })
      .then(function(){ return db.set('s7/current', id); });
  };
}

function attach(){
  db.get(base()+'/meta').then(function(meta){
    if(!meta){ renderSetup(); return; }
    pack=S7.pack(meta.pack);
    document.getElementById('ttl').textContent=pack?pack.title:meta.pack;
    students={}; answers={}; nStud=0;
    db.on(base()+'/state', function(s){ state=s||{mode:'lobby'}; shell(); subscribeAnswers(); });
    /* presence, one message per student joining or leaving */
    db.onChild(base()+'/st', {
      added:function(k,v){ if(!students[k]) nStud++; students[k]=v||{}; countsDirty(); },
      changed:function(k,v){ students[k]=v||{}; countsDirty(); },
      removed:function(k){ if(students[k]){ delete students[k]; nStud--; } countsDirty(); }
    });
  });
}
function subscribeAnswers(){
  var want=(state.mode==='youdo')?state.key:null;
  if(ansUnsub){ ansUnsub(); ansUnsub=null; }
  answers={};
  if(want==null){ countsDirty(); return; }
  ansUnsub=db.onChild(base()+'/an/'+want, {
    added:function(k,v){ answers[k]=v||{}; countsDirty(); },
    changed:function(k,v){ answers[k]=v||{}; countsDirty(); },
    removed:function(k){ delete answers[k]; countsDirty(); }
  });
}

/* ---------- the shell, rebuilt only when the mode changes ---------- */
var shellMode=null;
function shell(){
  document.getElementById('state').textContent=
    state.mode==='lobby'?'lobby':(state.mode==='grid'?'the twelve':(state.mode==='done'?'finished':'You do '+state.key));
  var sig=state.mode+':'+state.key;
  if(sig===shellMode){ paintCounts(); return; }
  shellMode=sig;
  var yd=(pack&&pack.youdo||[]).map(function(x){
    return '<button class="btn small'+(state.mode==='youdo'&&state.key===x.n?' on':'')+'" data-go="'+x.n+'">'+x.n+'</button>';
  }).join('');
  main.innerHTML=
    '<div class="tbar">'+
      '<button class="btn small'+(state.mode==='lobby'?' on':'')+'" data-mode="lobby">Lobby</button>'+
      '<span class="ydgroup"><span class="lab">You do</span>'+yd+'</span>'+
      '<button class="btn small'+(state.mode==='grid'?' on':'')+'" data-mode="grid">The twelve</button>'+
      '<button class="btn small'+(state.mode==='done'?' on':'')+'" data-mode="done">Finish</button>'+
      '<span class="sp"></span>'+
      (state.mode==='youdo'?'<button class="btn gold small" id="rev">'+(state.reveal?'Hide':'Reveal')+' solution</button>':'')+
      (state.mode==='grid'?'<button class="btn gold small" id="ga">'+(state.gridAns?'Hide':'Show')+' answers</button>'+
                           '<button class="btn small" id="gs">'+(state.gridSol?'Hide':'Show')+' solutions</button>':'')+
      '<button class="btn grey small" id="reset">Reset</button>'+
    '</div>'+
    '<div class="tally" id="tally"></div>'+
    (state.mode==='youdo'?'<div class="wrongs" id="wrongs"></div>':'')+
    '<div class="roster"><div class="rhead"><input id="find" class="inp" placeholder="Find a student by name"><span class="muted" id="rcount"></span></div><div class="rlist" id="rlist"></div></div>'+
    '<div id="focus"></div>';
  main.querySelectorAll('[data-mode]').forEach(function(b){ b.onclick=function(){ setState({mode:b.dataset.mode, key:0, reveal:0}); }; });
  main.querySelectorAll('[data-go]').forEach(function(b){ b.onclick=function(){ setState({mode:'youdo', key:+b.dataset.go, reveal:0}); }; });
  var r=document.getElementById('rev'); if(r) r.onclick=function(){ setState({reveal: state.reveal?0:1}); };
  var ga=document.getElementById('ga'); if(ga) ga.onclick=function(){ setState({gridAns: state.gridAns?0:1}); };
  var gs=document.getElementById('gs'); if(gs) gs.onclick=function(){ setState({gridSol: state.gridSol?0:1}); };
  document.getElementById('reset').onclick=resetAll;
  document.getElementById('find').addEventListener('input', paintRoster);
  paintCounts();
}
function setState(patch){ db.update(base()+'/state', patch); }

/* ---------- counts, throttled so 500 answers do not repaint 500 times ---------- */
var dirty=false;
function countsDirty(){ if(dirty) return; dirty=true; setTimeout(function(){ dirty=false; paintCounts(); }, 250); }
function paintCounts(){
  document.getElementById('cap').textContent=nStud+' in the room';
  var t=document.getElementById('tally'); if(!t) return;
  var ans=0, cor=0, ext=0;
  for(var k in answers){ var a=answers[k]; if(a.v!=null) ans++; if(a.c) cor++; if(a.x) ext++; }
  function tile(n,l,cls){ return '<div class="tile '+(cls||'')+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
  if(state.mode==='youdo'){
    var pct = ans? Math.round(cor/ans*100) : 0;
    t.innerHTML=tile(nStud,'in the room')+tile(ans,'have answered')+tile(cor,'correct','good')+
                tile(pct+'%','of answers correct')+tile(ext,'done the extension','gold');
  } else {
    t.innerHTML=tile(nStud,'in the room');
  }
  paintWrongs(); paintRoster();
}
function paintWrongs(){
  var w=document.getElementById('wrongs'); if(!w) return;
  var groups={};
  for(var k in answers){ var a=answers[k]; if(a.v==null||a.c) continue;
    var key=String(a.v).trim().toLowerCase(); (groups[key]=groups[key]||{t:a.v,n:0}).n++; }
  var list=Object.keys(groups).map(function(k){ return groups[k]; }).sort(function(a,b){ return b.n-a.n; }).slice(0,6);
  if(!list.length){ w.innerHTML='<div class="muted">No wrong answers in yet.</div>'; return; }
  w.innerHTML='<div class="lab">Most common wrong answers</div>'+list.map(function(g){
    return '<span class="wchip"><b>'+S7.esc(g.t)+'</b>'+g.n+'</span>'; }).join('');
}
function paintRoster(){
  var l=document.getElementById('rlist'); if(!l) return;
  var f=(document.getElementById('find').value||'').trim().toLowerCase();
  var keys=Object.keys(students);
  keys.sort(function(a,b){ return (students[a].n||'').localeCompare(students[b].n||''); });
  var shownKeys=keys.filter(function(k){ return !f || (students[k].n||'').toLowerCase().indexOf(f)>=0; });
  document.getElementById('rcount').textContent=shownKeys.length+' of '+keys.length+' shown';
  var cap=f?shownKeys.length:Math.min(shownKeys.length, 200);
  var html=shownKeys.slice(0,cap).map(function(k){
    var a=answers[k]||{}, cls='', mark='';
    if(a.v!=null){ cls=a.c?'ok':'no'; mark=a.c?'&#10003;':'&#10007;'; }
    if(a.x){ cls='ext'; mark='&#9733;'; }
    return '<button class="rw '+cls+'" data-u="'+k+'"><span class="nm">'+S7.esc(students[k].n||'?')+'</span>'+
           (a.v!=null?'<span class="av">'+S7.esc(a.v)+'</span>':'')+'<span class="mk">'+mark+'</span></button>';
  }).join('');
  l.innerHTML=html+(cap<shownKeys.length?'<div class="muted" style="padding:8px">Showing the first '+cap+'. Type a name to find anyone.</div>':'');
  l.querySelectorAll('.rw').forEach(function(b){ b.onclick=function(){ focusOn(b.dataset.u); }; });
}

/* ---------- drill down to one student ---------- */
function focusOn(u){
  if(watchUnsub){ watchUnsub(); watchUnsub=null; }
  if(watching) db.remove(base()+'/req/'+watching);
  watching=u;
  db.set(base()+'/req/'+u, state.key||1);
  var f=document.getElementById('focus');
  var a=answers[u]||{};
  f.innerHTML='<div class="focusbox"><div class="fhead"><b>'+S7.esc((students[u]||{}).n||'?')+'</b>'+
    (a.v!=null?'<span class="pill '+(a.c?'good':'bad')+'">'+S7.esc(a.v)+'</span>':'<span class="pill">no answer yet</span>')+
    '<span class="sp"></span><button class="btn small" id="fclose">Close</button></div>'+
    '<canvas id="fbd" class="fbd"></canvas>'+
    '<div class="ansrow"><input id="fmsg" class="inp" maxlength="120" placeholder="Send them a note"><button class="btn gold" id="fsend">Send</button></div>'+
    '<div class="quick">'+['Check your multiplier','Is that the whole or the part?','Divide, do not multiply','Nearly, check the rounding','Great work'].map(function(t){
        return '<button class="btn small grey" data-q="'+S7.esc(t)+'">'+S7.esc(t)+'</button>'; }).join('')+'</div>'+
    '<button class="btn grey small" id="fkick" style="margin-top:10px">Remove this student</button></div>';
  var cv=document.getElementById('fbd');
  watchUnsub=db.on(base()+'/bd/'+u, function(strokes){ S7.paint(cv, strokes||[]); });
  document.getElementById('fclose').onclick=closeFocus;
  document.getElementById('fsend').onclick=function(){ var v=document.getElementById('fmsg').value.trim(); if(v){ db.set(base()+'/msg/'+u,{t:v,ts:db.serverTime()}); toast('Sent'); document.getElementById('fmsg').value=''; } };
  f.querySelectorAll('[data-q]').forEach(function(b){ b.onclick=function(){ db.set(base()+'/msg/'+u,{t:b.dataset.q,ts:db.serverTime()}); toast('Sent'); }; });
  document.getElementById('fkick').onclick=function(){ db.remove(base()+'/st/'+u); closeFocus(); };
  f.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closeFocus(){
  if(watchUnsub){ watchUnsub(); watchUnsub=null; }
  if(watching){ db.remove(base()+'/req/'+watching); db.remove(base()+'/bd/'+watching); watching=null; }
  document.getElementById('focus').innerHTML='';
}

function resetAll(){
  if(!confirm('Clear every student, answer and note for this session?')) return;
  ['st','an','msg','req','bd'].forEach(function(k){ db.remove(base()+'/'+k); });
  students={}; answers={}; nStud=0; countsDirty();
  toast('Cleared');
}
})();
</script>
</body>
</html>
